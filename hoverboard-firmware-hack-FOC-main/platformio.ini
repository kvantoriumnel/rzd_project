; PlatformIO Project Configuration File

[platformio]
include_dir = Inc
src_dir     = Src

[env:hoverboard]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube

build_flags =
    -D PLATFORMIO
    -D VARIANT_USART
    -D HSE_VALUE=8000000
    -D USE_HAL_DRIVER
    -D STM32F103xE
    -Wl,-T./STM32F103RCTx_FLASH.ld

upload_protocol = stlink
debug_tool = stlink